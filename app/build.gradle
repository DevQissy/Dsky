apply plugin: 'com.android.application'
//apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'


// See https://developer.android.com/studio/publish/app-signing#secure-shared-keystore
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
try {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} catch (Exception ex) {
    logger.warn("No keys.  Release disabled: $ex.message")
    keystoreProperties['keyAlias'] = ''
    keystoreProperties['keyPassword'] = ''
    keystoreProperties['storeFile'] = '/dev/null'
    keystoreProperties['storePassword'] = ''
}

// Go backend build constants
def goSourceDir = "${projectDir}/src/go"
def goSourcePackages = ["${goSourceDir}/backend",
                        "${goSourceDir}/dsky",
                        "${goSourceDir}/dsky/split",
                        "${goSourceDir}/dsky/protect"]
def goBuildDir = file("${buildDir}/go")
def goBackendAAR = file("${goBuildDir}/backend.aar")

def goToolchain = "local"
println "using Go toolchain ${goToolchain}"

// Standard Android build definition
android {
    buildFeatures {
        buildConfig = true
        compose true
        resValues = true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    signingConfigs {
        config {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    compileSdkVersion ANDROID_COMPILE_SDK_VERSION as int

    defaultConfig {
        applicationId "com.devqissy.dsky"
        minSdkVersion ANDROID_MIN_SDK_VERSION as int
        targetSdkVersion ANDROID_TARGET_SDK_VERSION as int
        versionCode 3
        versionName "1.3.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        debug {
            pseudoLocalesEnabled true
            multiDexEnabled true
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.devqissy.dsky'
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/public' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"

    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.datastore:datastore-core:1.2.1'
    implementation 'androidx.collection:collection-ktx:1.6.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.annotation:annotation:1.10.0'

    testImplementation 'org.json:json:20240303'
    testImplementation 'org.mockito:mockito-core:5.14.2'

    implementation 'com.github.bumptech.glide:glide:5.0.7'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'
    implementation 'com.google.guava:guava:33.6.0-android'

    implementation "com.airbnb.android:lottie:6.7.1"
    implementation 'com.squareup.picasso:picasso:2.71828'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    implementation files(goBackendAAR)
}
          
configurations.all {
    resolutionStrategy {
        force 'androidx.collection:collection-ktx:1.6.0'
        force 'androidx.exifinterface:exifinterface:1.4.2'
        force 'androidx.annotation:annotation-experimental:1.6.0'
    }
}
// Go backend build tasks
tasks.register('ensureGoMobile') {
    doLast {
        goBuildDir.mkdirs()
        copy {
            from 'C:/Users/Qissy/go/bin'
            into goBuildDir
            include 'gomobile.exe'
        }
    }
}

tasks.register('compileGoBackend', Exec) {
    dependsOn 'ensureGoMobile'

    inputs.dir(goSourceDir)
    outputs.file(goBackendAAR)

    environment 'GOTOOLCHAIN', goToolchain
    environment 'ANDROID_HOME', "${System.getenv('LOCALAPPDATA')}\\Android\\Sdk"
    environment 'PATH', goBuildDir.getPath() +
            System.getProperty('path.separator') +
            System.getenv('PATH')

    workingDir goSourceDir

    commandLine("${goBuildDir}/gomobile", 'bind',
            '-ldflags=-s -w -extldflags=-Wl,-z,max-page-size=16384',
            '-target=android/arm64',
            "-androidapi=${android.defaultConfig.minSdk}",
            '-o', goBackendAAR,
            *goSourcePackages)
}

// Ensure the Go backend AAR is built before Android preBuild.
tasks.named("preBuild") {
    dependsOn("compileGoBackend")
}
